<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Painel da Loja | Maranhão</title><link rel="icon" href="WhatsApp%20Image%202026-09-12%20at%2015.53.43.jpeg"><link rel="stylesheet" href="painel.css?v=5"><link rel="stylesheet" href="painel-visual-v2.css?v=2"></head>
<body><main>
<section id="loginScreen" class="login-screen"><div class="login-card"><img class="login-logo" src="WhatsApp%20Image%202026-09-10%20at%2016.10.08.jpeg" alt="Maranhão"><h1>Painel da Loja</h1><p>Acesso exclusivo para equipe autorizada.</p><form id="loginForm"><label for="usuario">E-mail do Mestre ou primeiro nome</label><input id="usuario" autocomplete="username" placeholder="Ex.: maria ou seu e-mail" required><label for="password">Senha</label><div style="position:relative"><input id="password" type="password" autocomplete="current-password" required style="padding-right:92px;width:100%;box-sizing:border-box"><button type="button" class="password-clear" data-password-target="password" aria-label="Limpar senha" title="Limpar senha" style="position:absolute;right:48px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:20px;cursor:pointer;padding:6px">✕</button><button type="button" class="password-eye" data-password-target="password" aria-label="Mostrar senha" title="Mostrar senha" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:21px;cursor:pointer;padding:6px">👁️</button></div><button id="loginBtn" type="submit">ENTRAR</button><p id="loginError" class="error hidden"></p></form></div></section>
<section id="panelScreen" class="panel-screen hidden"><header class="topbar"><img src="WhatsApp%20Image%202026-09-10%20at%2016.10.08.jpeg" alt="Maranhão"><div class="top-actions"><span id="staffName">Painel da Loja</span><button id="employeesBtn" class="ghost hidden">Funcionários</button><button id="logoutBtn" class="ghost">Sair</button></div></header><div class="panel-wrap">
<div id="masterSetup" class="hidden"></div>
<div id="clientsArea"><div class="heading-row"><div><h1>Pré-cadastros</h1><p>Gerencie os clientes enviados pelo aplicativo.</p></div><button id="refreshBtn" class="primary small">↻ Atualizar</button></div><div class="stats" id="stats"></div><div class="filters"><input id="searchInput" placeholder="Buscar por nome, CPF, WhatsApp ou protocolo"><select id="statusFilter"><option value="">Todos os status</option><option value="novo">Novo</option><option value="em_analise">Em análise</option><option value="pendente_documentos">Pendente documentos</option><option value="aprovado">Aprovado</option><option value="reprovado">Reprovado</option><option value="finalizado">Finalizado</option></select></div><div id="loading" class="loading hidden">Carregando...</div><div id="empty" class="empty hidden">Nenhum pré-cadastro encontrado.</div><div id="clientList" class="client-list"></div></div>
<div id="employeesArea" class="hidden"><div class="heading-row"><div><h1>Funcionários</h1><p>Gerencie os acessos da equipe da loja.</p></div><button id="backClients" class="primary small">Voltar aos clientes</button></div><section class="section full" style="margin-top:20px"><h3>Criar novo funcionário</h3><div class="analysis-grid"><label>Primeiro nome<input id="newEmployeeName" placeholder="Ex.: Maria"></label><label>Usuário<input id="newEmployeeUser" placeholder="Ex.: maria"></label></div><label for="newEmployeePass">Senha inicial</label><div style="position:relative"><input id="newEmployeePass" type="password" minlength="6" placeholder="Mínimo 6 caracteres" style="padding-right:92px;width:100%;box-sizing:border-box"><button type="button" class="password-clear" data-password-target="newEmployeePass" aria-label="Limpar senha" title="Limpar senha" style="position:absolute;right:48px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:20px;cursor:pointer;padding:6px">✕</button><button type="button" class="password-eye" data-password-target="newEmployeePass" aria-label="Mostrar senha" title="Mostrar senha" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:21px;cursor:pointer;padding:6px">👁️</button></div><button id="createEmployee" class="primary">CRIAR FUNCIONÁRIO</button><p id="employeeMsg" class="hidden"></p></section><div id="employeeList" class="client-list" style="margin-top:18px"></div></div>
</div></section></main>
<dialog id="detailDialog"><div class="dialog-head"><div><strong id="detailName">Cliente</strong><span id="detailProtocol"></span></div><button id="closeDialog" class="icon-btn">×</button></div><div id="detailBody" class="detail-body"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="painel.js?v=6"></script><script src="painel-extra.js?v=3"></script><script src="painel-funcionarios.js?v=1"></script><script src="painel-delete.js?v=1"></script><script src="painel-cadastro-v2.js?v=1"></script><script>document.addEventListener('click',function(e){const clear=e.target.closest('.password-clear');if(clear){const input=document.getElementById(clear.dataset.passwordTarget);if(input){input.value='';input.focus();}return;}const b=e.target.closest('.password-eye');if(!b)return;const input=document.getElementById(b.dataset.passwordTarget);if(!input)return;const mostrar=input.type==='password';input.type=mostrar?'text':'password';b.textContent=mostrar?'🙈':'👁️';b.setAttribute('aria-label',mostrar?'Ocultar senha':'Mostrar senha');input.focus();});</script></body></html>
